<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">
  <meta name="description" content="서울대학교 공대 농구동아리 ENCBA의 운영 앱. 공지와 일정, 참석 투표, 경기 복기를 한곳에서.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <!-- iOS 홈 화면에 추가할 때 아이콘 아래 붙는 이름. manifest의 short_name과
       같은 "LOCKER"로 맞춰 어느 경로로 설치해도 같은 이름이 되게 한다. -->
  <meta name="apple-mobile-web-app-title" content="LOCKER">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>ENCBA LOCKER</title>
  <link rel="canonical" href="https://encbalocker-mu.vercel.app/">

  <!-- 링크 미리보기(카카오톡·슬랙·디스코드 등).
       og:image는 반드시 절대 주소여야 하고, 미리보기를 만드는 서버는
       로그인하지 않은 채로 가져가므로 공개 경로에 둔다. -->
  <meta property="og:site_name" content="ENCBA LOCKER">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="ko_KR">
  <meta property="og:url" content="https://encbalocker-mu.vercel.app/">
  <meta property="og:title" content="ENCBA LOCKER">
  <meta property="og:description" content="서울대학교 공대 농구동아리 ENCBA의 운영 앱. 공지와 일정, 참석 투표, 경기 복기를 한곳에서.">
  <meta property="og:image" content="https://encbalocker-mu.vercel.app/og-image.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="ENCBA LOCKER">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="ENCBA LOCKER">
  <meta name="twitter:description" content="서울대학교 공대 농구동아리 ENCBA의 운영 앱. 공지와 일정, 참석 투표, 경기 복기를 한곳에서.">
  <meta name="twitter:image" content="https://encbalocker-mu.vercel.app/og-image.png">

  <meta name="theme-color" content="#071F4B">
  <link rel="manifest" href="manifest.json">
  <style>
    :root {
      --encba-visual-viewport-height: 100dvh;
      --encba-keyboard-inset: 0px;
    }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      min-height: 100dvh;
      background: #e9eef5;
      /* 세로 축만 가둔다.
         이게 없으면 목록 맨 위에서 아래로 조금만 당겨도 브라우저가 앱
         전체를 새로고침해 버린다. 손짓 한 번에 화면이 끊기고 처음부터
         다시 뜨는 것처럼 보이는 원인이다.
         가로 축은 절대 건드리면 안 된다. overscroll-behavior를 양축
         모두 막으면 브라우저의 가장자리 스와이프(뒤로가기)까지 눌려서,
         손가락을 밀어도 넘어갈 듯 말 듯 하다가 되돌아오는 어정쩡한
         제스처가 된다. 뒤로가기는 브라우저가 온전히 맡는다. */
      overscroll-behavior-y: contain;
    }
    flutter-view {
      box-sizing: border-box;
      height: var(--encba-visual-viewport-height, 100dvh);
      min-height: 0;
      padding-bottom: calc(
        var(--encba-keyboard-inset, 0px) + env(safe-area-inset-bottom, 0px)
      );
    }
    #encba-boot {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 12px;
      color: #0b2347; font: 700 14px/1.4 system-ui, sans-serif;
      padding: 24px; box-sizing: border-box; text-align: center;
    }
    #encba-boot-bar-track {
      width: 220px; max-width: 60vw; height: 6px; border-radius: 999px;
      background: #c9d7e8; overflow: hidden;
    }
    #encba-boot-bar-fill {
      height: 100%; width: 4%; border-radius: 999px;
      background: #00539b;
      transition: width .25s ease-out, background-color .3s ease-out;
    }
    #encba-boot-bar-fill.encba-boot-done { background: #1aa260; }
    #encba-boot-percent { color: #5c6b84; font-weight: 600; font-size: 12px; }
    #encba-boot-percent.encba-boot-done { color: #1aa260; }
  </style>
</head>
<body>
  <div id="encba-boot" role="status" aria-live="polite">
    <div>ENCBA LOCKER 불러오는 중</div>
    <div id="encba-boot-bar-track">
      <div id="encba-boot-bar-fill"></div>
    </div>
    <div id="encba-boot-percent">0%</div>
  </div>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    (function () {
      const root = document.documentElement;

      // Flutter Web의 부트스트랩 엔진은 초기화할 때마다 <meta name="viewport">를
      // 무조건 지우고 자기 태그(`interactive-widget` 없이 width/initial-scale만)로
      // 바꿔치기한다. 그러면 위 태그에 넣은 interactive-widget=resizes-content가
      // 매번 사라져 키보드가 레이아웃을 밀어내지 않는다. 엔진이 새 태그를 넣을
      // 때마다 다시 붙여 준다.
      function patchViewportMeta(meta) {
        if (!meta || meta.dataset.encbaPatched) return;
        const content = meta.getAttribute('content') || '';
        if (content.indexOf('interactive-widget') === -1) {
          meta.setAttribute(
            'content',
            content ? `${content}, interactive-widget=resizes-content` : 'interactive-widget=resizes-content'
          );
        }
        meta.dataset.encbaPatched = 'true';
      }

      patchViewportMeta(document.querySelector('meta[name="viewport"]'));
      new MutationObserver(function () {
        patchViewportMeta(document.querySelector('meta[name="viewport"]'));
      }).observe(document.head, { childList: true });

      function isTextInput(element) {
        return element instanceof HTMLElement && (
          element.matches('input, textarea, [contenteditable="true"]') ||
          element.closest('input, textarea, [contenteditable="true"]')
        );
      }

      function centerInput(element) {
        if (!isTextInput(element)) return;
        requestAnimationFrame(function () {
          window.setTimeout(function () {
            if (document.activeElement !== element && !element.contains(document.activeElement)) {
              return;
            }
            element.scrollIntoView({ behavior: 'smooth', block: 'center' });
          }, 120);
        });
      }

      function updateVisualViewport() {
        const viewport = window.visualViewport;
        if (!viewport) return;
        const layoutHeight = document.documentElement.clientHeight;
        const keyboardHeight = Math.max(
          0,
          layoutHeight - viewport.height - viewport.offsetTop
        );
        root.style.setProperty(
          '--encba-visual-viewport-height',
          `${Math.round(viewport.height)}px`
        );
        root.style.setProperty(
          '--encba-keyboard-inset',
          `${Math.round(keyboardHeight)}px`
        );
        if (keyboardHeight > 0) centerInput(document.activeElement);
      }

      document.addEventListener('focusin', function (event) {
        centerInput(event.target);
      }, true);

      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', updateVisualViewport);
        window.visualViewport.addEventListener('scroll', updateVisualViewport);
        updateVisualViewport();
      }
    })();

    // 로딩 중 대략적인 진행률 바 + 퍼센트. Flutter는 실제 다운로드
    // 진행률(바이트 단위)을 알려주는 API가 없어서, 리소스 타이밍으로 실제
    // 받아온 바이트를 누적하고 이 앱의 첫 프레임 전 다운로드 총량(엔진
    // wasm + JS 번들 + 번들 폰트 3종) 추정치와 비교한 근사값이다.
    // "홈 화면에 추가" 안내는 로그인 화면(AuthScreen)의 PwaInstallCard로
    // 옮겨서 여기서는 더 이상 보여주지 않는다.
    (function () {
      var barEl = document.getElementById('encba-boot-bar-fill');
      var percentEl = document.getElementById('encba-boot-percent');
      var ESTIMATED_TOTAL_BYTES = 18 * 1024 * 1024;
      // 첫 프레임 전에는 여기까지만 올라간다. 100%는 실제로 뜬 순간에만.
      var CEILING_PERCENT = 92;
      var seen = {};
      var loadedBytes = 0;
      var visualPercent = 4;
      var startedAt = performance.now();

      function render() {
        if (!barEl || !percentEl) return;
        var bytePercent = Math.round((loadedBytes / ESTIMATED_TOTAL_BYTES) * 100);
        // 바이트 추정치도 총량이 어림값이라 100%를 넘길 수 있다. 같이 눌러 둔다.
        var percent = Math.max(
          4,
          Math.min(CEILING_PERCENT, Math.max(bytePercent, visualPercent))
        );
        barEl.style.width = percent + '%';
        percentEl.textContent = percent + '%';
      }

      // 캐시된 PWA에서는 transferSize가 0이라 실제로는 준비 중이어도
      // 진행률이 4%에 멈춰 보인다. 그래서 시간 기반 추정치를 함께 쓴다.
      //
      // 다만 이 추정치는 절대 100%에 닿지 않는다. 예전에는 0.9초면 100%가
      // 돼서, 느린 회선에서는 "100%"를 띄운 채 한참 더 기다리게 만들었다.
      // 다 됐다고 해 놓고 안 끝나는 진행률은 없느니만 못하다.
      // 1 - e^(-t/T) 곡선이라 처음엔 빠르게 오르다 92%에 점점 가까워지기만
      // 하고, 진짜 100%는 첫 프레임이 떴을 때만 찍힌다.
      var visualTimer = window.setInterval(function () {
        var elapsed = performance.now() - startedAt;
        var eased = 1 - Math.exp(-elapsed / 2200);
        visualPercent = 4 + Math.round(eased * (CEILING_PERCENT - 4));
        render();
      }, 45);

      if (window.PerformanceObserver) {
        try {
          var observer = new PerformanceObserver(function (list) {
            list.getEntries().forEach(function (entry) {
              if (seen[entry.name]) return;
              seen[entry.name] = true;
              loadedBytes += entry.transferSize || entry.encodedBodySize || entry.decodedBodySize || 0;
            });
            render();
          });
          observer.observe({ type: 'resource', buffered: true });
        } catch (e) {
          /* 관찰 실패해도 로딩 자체는 그대로 진행된다. */
        }
      }

      // 첫 프레임이 뜨면 100%로 채우고 초록색으로 바꿔 "다 됐다"는 걸
      // 짧게 보여준 뒤(작은 도파민 보상) 화면을 없앤다.
      window.addEventListener('flutter-first-frame', function () {
        window.clearInterval(visualTimer);
        // 여기서만 100%를 찍는다. 화면이 실제로 그려진 순간이다.
        if (barEl && percentEl) {
          barEl.style.width = '100%';
          percentEl.textContent = '100%';
          barEl.classList.add('encba-boot-done');
          percentEl.classList.add('encba-boot-done');
        }
        window.setTimeout(function () {
          document.getElementById('encba-boot')?.remove();
        }, 380);
      });
    })();

    // 새 배포가 곧바로 적용되게 한다.
    //
    // Flutter의 서비스 워커는 캐시에서 앱을 먼저 띄우고 새 버전은 다음
    // 방문에나 반영한다. 그래서 고친 걸 배포해도 "그대로인데요"가 나왔다.
    // 새 워커가 제어권을 넘겨받는 순간 한 번만 새로고침해서 방금 받은
    // 버전으로 갈아탄다. (한 번만 - 안 그러면 새로고침이 무한 반복된다.)
    if ('serviceWorker' in navigator) {
      var encbaReloading = false;
      navigator.serviceWorker.addEventListener('controllerchange', function () {
        if (encbaReloading) return;
        encbaReloading = true;
        window.location.reload();
      });
    }

    // 백그라운드 푸시 알림 서비스 워커. Vercel 빌드가 Firebase 설정 값을
    // 넣어 생성한 파일이 배포에 있을 때만 등록한다(없으면 조용히 건너뛴다).
    //
    // Flutter의 서비스 워커 등록과 겹치면 서로 기다리다가 "prepareServiceWorker
    // took more than 4000ms" 로 밀려난다. 첫 프레임이 뜬 뒤에 등록해서
    // 앱 부팅 경로를 비켜 준다.
    window.addEventListener('flutter-first-frame', function () {
      if (!('serviceWorker' in navigator)) return;
      fetch('firebase-messaging-sw.js', { method: 'HEAD' })
        .then(function (response) {
          if (!response.ok) return;
          return navigator.serviceWorker.register('firebase-messaging-sw.js');
        })
        .catch(function () {
          /* 파일이 없거나 등록에 실패해도 로컬 알림은 그대로 동작한다. */
        });
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
