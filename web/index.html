<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">
  <meta name="description" content="서울대학교 공대 농구 동아리 ENCBA 운영 앱">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <!-- iOS 홈 화면에 추가할 때 아이콘 아래 붙는 이름. manifest의 short_name과
       같은 "LOCKER"로 맞춰 어느 경로로 설치해도 같은 이름이 되게 한다. -->
  <meta name="apple-mobile-web-app-title" content="LOCKER">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>ENCBA LOCKER</title>
  <link rel="manifest" href="manifest.json">
  <style>
    :root {
      --encba-visual-viewport-height: 100dvh;
      --encba-keyboard-inset: 0px;
    }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      min-height: 100dvh;
      background: #e9eef5;
    }
    flutter-view {
      box-sizing: border-box;
      height: var(--encba-visual-viewport-height, 100dvh);
      min-height: 0;
      padding-bottom: calc(
        var(--encba-keyboard-inset, 0px) + env(safe-area-inset-bottom, 0px)
      );
    }
    #encba-boot {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 14px;
      color: #0b2347; font: 700 14px/1.4 system-ui, sans-serif;
      padding: 24px; box-sizing: border-box; text-align: center;
    }
    #encba-boot-spinner { display: flex; align-items: center; gap: 10px; }
    #encba-boot-spinner::before {
      content: ""; width: 28px; height: 28px;
      border: 3px solid #c9d7e8; border-top-color: #00539b;
      border-radius: 50%; animation: encba-spin .8s linear infinite;
    }
    @keyframes encba-spin { to { transform: rotate(360deg); } }
    #encba-boot-percent { color: #5c6b84; font-weight: 600; min-width: 2.5em; }
    #encba-boot-pwa {
      display: none; align-items: center; gap: 10px; max-width: 320px;
      margin-top: 6px; padding: 10px 14px; border-radius: 14px;
      background: #ffffffb3; border: 1px solid #d9e2ef;
      font-weight: 500; font-size: 12px; color: #123a72; text-align: left;
    }
    #encba-boot-pwa.encba-show { display: flex; }
    #encba-boot-pwa img {
      width: 34px; height: 34px; border-radius: 9px; flex: none;
    }
  </style>
</head>
<body>
  <div id="encba-boot" role="status" aria-live="polite">
    <div id="encba-boot-spinner">ENCBA LOCKER 불러오는 중<span id="encba-boot-percent"></span></div>
    <div id="encba-boot-pwa">
      <img src="icons/Icon-192.png" alt="">
      <span id="encba-boot-pwa-text"></span>
    </div>
  </div>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    (function () {
      const root = document.documentElement;

      // Flutter Web의 부트스트랩 엔진은 초기화할 때마다 <meta name="viewport">를
      // 무조건 지우고 자기 태그(`interactive-widget` 없이 width/initial-scale만)로
      // 바꿔치기한다. 그러면 위 태그에 넣은 interactive-widget=resizes-content가
      // 매번 사라져 키보드가 레이아웃을 밀어내지 않는다. 엔진이 새 태그를 넣을
      // 때마다 다시 붙여 준다.
      function patchViewportMeta(meta) {
        if (!meta || meta.dataset.encbaPatched) return;
        const content = meta.getAttribute('content') || '';
        if (content.indexOf('interactive-widget') === -1) {
          meta.setAttribute(
            'content',
            content ? `${content}, interactive-widget=resizes-content` : 'interactive-widget=resizes-content'
          );
        }
        meta.dataset.encbaPatched = 'true';
      }

      patchViewportMeta(document.querySelector('meta[name="viewport"]'));
      new MutationObserver(function () {
        patchViewportMeta(document.querySelector('meta[name="viewport"]'));
      }).observe(document.head, { childList: true });

      function isTextInput(element) {
        return element instanceof HTMLElement && (
          element.matches('input, textarea, [contenteditable="true"]') ||
          element.closest('input, textarea, [contenteditable="true"]')
        );
      }

      function centerInput(element) {
        if (!isTextInput(element)) return;
        requestAnimationFrame(function () {
          window.setTimeout(function () {
            if (document.activeElement !== element && !element.contains(document.activeElement)) {
              return;
            }
            element.scrollIntoView({ behavior: 'smooth', block: 'center' });
          }, 120);
        });
      }

      function updateVisualViewport() {
        const viewport = window.visualViewport;
        if (!viewport) return;
        const layoutHeight = document.documentElement.clientHeight;
        const keyboardHeight = Math.max(
          0,
          layoutHeight - viewport.height - viewport.offsetTop
        );
        root.style.setProperty(
          '--encba-visual-viewport-height',
          `${Math.round(viewport.height)}px`
        );
        root.style.setProperty(
          '--encba-keyboard-inset',
          `${Math.round(keyboardHeight)}px`
        );
        if (keyboardHeight > 0) centerInput(document.activeElement);
      }

      document.addEventListener('focusin', function (event) {
        centerInput(event.target);
      }, true);

      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', updateVisualViewport);
        window.visualViewport.addEventListener('scroll', updateVisualViewport);
        updateVisualViewport();
      }
    })();

    window.addEventListener('flutter-first-frame', function () {
      document.getElementById('encba-boot')?.remove();
    });

    // 로딩 중 대략적인 진행률 표시. Flutter는 실제 다운로드 진행률(바이트
    // 단위)을 알려주는 API가 없어서, 리소스 타이밍으로 실제 받아온 바이트를
    // 누적하고 이 앱의 첫 프레임 전 다운로드 총량(엔진 wasm + JS 번들 +
    // 번들 폰트 3종) 추정치와 비교한 근사값이다. 100%를 못 채우고 먼저
    // first-frame이 오면(캐시 히트 등) 그대로 화면이 사라지므로 문제없다.
    (function () {
      var percentEl = document.getElementById('encba-boot-percent');
      if (!percentEl || !window.PerformanceObserver) return;
      var ESTIMATED_TOTAL_BYTES = 18 * 1024 * 1024;
      var seen = {};
      var loadedBytes = 0;
      var lastShown = -1;

      function render() {
        var percent = Math.min(99, Math.round((loadedBytes / ESTIMATED_TOTAL_BYTES) * 100));
        if (percent === lastShown) return;
        lastShown = percent;
        percentEl.textContent = ' ' + percent + '%';
      }

      try {
        var observer = new PerformanceObserver(function (list) {
          list.getEntries().forEach(function (entry) {
            if (seen[entry.name]) return;
            seen[entry.name] = true;
            loadedBytes += entry.transferSize || entry.encodedBodySize || entry.decodedBodySize || 0;
          });
          render();
        });
        observer.observe({ type: 'resource', buffered: true });
      } catch (e) {
        /* 관찰 실패해도 로딩 자체는 그대로 진행된다. */
      }
    })();

    // 로그인 전 방문자에게도 "홈 화면에 추가"를 안내한다. 이미 설치돼
    // standalone으로 열려 있으면 보여줄 이유가 없다.
    (function () {
      var el = document.getElementById('encba-boot-pwa');
      var textEl = document.getElementById('encba-boot-pwa-text');
      if (!el || !textEl) return;

      var isStandalone = window.navigator.standalone === true ||
        (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
      if (isStandalone) return;

      var ua = window.navigator.userAgent.toLowerCase();
      var isIosLike = (ua.indexOf('iphone') !== -1 || ua.indexOf('ipad') !== -1 || ua.indexOf('ipod') !== -1 ||
        (ua.indexOf('macintosh') !== -1 && window.navigator.maxTouchPoints > 1)) &&
        ua.indexOf('crios') === -1 && ua.indexOf('fxios') === -1;
      var isAndroid = ua.indexOf('android') !== -1;
      if (!isIosLike && !isAndroid) return;

      textEl.textContent = isIosLike
        ? 'Safari 하단 공유 버튼 → "홈 화면에 추가"를 누르면 앱처럼 쓸 수 있어요.'
        : '브라우저 메뉴 → "홈 화면에 추가"를 누르면 앱처럼 쓸 수 있어요.';
      el.classList.add('encba-show');
    })();

    // 백그라운드 푸시 알림 서비스 워커. Vercel 빌드가 Firebase 설정 값을
    // 넣어 생성한 파일이 배포에 있을 때만 등록한다(없으면 조용히 건너뛴다).
    if ('serviceWorker' in navigator) {
      fetch('firebase-messaging-sw.js', { method: 'HEAD' })
        .then(function (response) {
          if (!response.ok) return;
          return navigator.serviceWorker.register('firebase-messaging-sw.js');
        })
        .catch(function () {
          /* 파일이 없거나 등록에 실패해도 로컬 알림은 그대로 동작한다. */
        });
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
